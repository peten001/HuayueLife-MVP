<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#010911" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YunQiao Cashier" />
    <meta name="color-scheme" content="light" />
    <style>
      html.cashier-mobile-v2-preview-active,
      html.cashier-mobile-v2-preview-active body {
        background: #f3f6f1;
        color-scheme: light;
      }
    </style>
    <script>
      if (window.location.pathname.startsWith('/__preview/mobile-v2/')) {
        const overrideMeta = (name, content) => {
          const meta = document.querySelector(`meta[name="${name}"]`);
          if (!meta) return;
          if (!meta.hasAttribute('data-mobile-v2-original-content')) {
            meta.setAttribute('data-mobile-v2-original-content', meta.getAttribute('content') || '');
          }
          meta.setAttribute('content', content);
        };
        document.documentElement.classList.add('cashier-mobile-v2-preview-active');
        overrideMeta(
          'viewport',
          'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content',
        );
        overrideMeta('theme-color', '#fbfcfa');
        overrideMeta('apple-mobile-web-app-status-bar-style', 'default');
      }
    </script>
    <link rel="stylesheet" href="/terminal-bootstrap.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon-yunqiao-cashier-v2-180.png"
    />
    <title>YunQiao Cashier</title>
  </head>
  <body>
    <div id="app">
      <main
        id="cashier-boot"
        class="cashier-boot"
        data-state="loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="cashier-boot__center">
          <div class="cashier-boot__brand" aria-hidden="true">
            <img src="/yunqiao-cashier-splash.png" alt="" />
          </div>
          <section class="cashier-boot__card">
            <span class="cashier-boot__spinner" aria-hidden="true"></span>
            <strong class="cashier-boot__title">正在打开 Web 收银台</strong>
            <span id="cashier-boot-message" class="cashier-boot__message">
              正在初始化页面和登录状态…
            </span>
            <button
              id="cashier-boot-retry"
              class="cashier-boot__retry"
              type="button"
              hidden
            >重试</button>
          </section>
        </div>
      </main>
    </div>
    <script src="/terminal-bootstrap.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
