<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SettlementAdjustmentDialog — 8 states</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #061923;
      --panel: #0a2632;
      --field: #0d303d;
      --line: rgba(224, 245, 238, .16);
      --line-strong: rgba(224, 245, 238, .28);
      --text: #eef8f4;
      --muted: #9db3ae;
      --green: #43d89e;
      --green-strong: #2fc78d;
      --green-soft: rgba(67, 216, 158, .13);
      --focus: #77e5ba;
      --danger: #ff9e96;
      --danger-soft: rgba(255, 107, 97, .11);
      --shadow: 0 24px 70px rgba(0, 8, 13, .42);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1100px, calc(100% - 32px)); margin: 36px auto 64px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 32px); letter-spacing: -.02em; }
    .lede { margin: 8px 0 26px; color: var(--muted); font-size: 14px; }
    .states { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .state {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .state > strong { padding-top: 14px; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .control { display: grid; gap: 7px; min-width: 0; }
    .control label { font-size: 13px; font-weight: 700; }
    .input-shell {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      min-height: 56px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: 2px solid transparent;
      outline-offset: 2px;
      background: var(--field);
    }
    .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 9px; background: rgba(238, 248, 244, .05); }
    .mode button, .save {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }
    .mode button.is-selected { border-color: rgba(67, 216, 158, .35); color: var(--green); background: var(--green-soft); }
    .input-shell input {
      width: 100%;
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      text-align: right;
    }
    .meta { display: flex; justify-content: space-between; gap: 12px; min-height: 18px; color: var(--muted); font-size: 12px; }
    .save {
      min-height: 44px;
      padding: 0 16px;
      outline: 2px solid transparent;
      outline-offset: 2px;
      color: var(--page);
      background: var(--green);
      cursor: pointer;
    }
    .state.is-hover .save { background: var(--green-strong); }
    .state.is-focus .input-shell { border-color: var(--green); outline-color: var(--focus); }
    .state.is-active .save { background: var(--green-strong); transform: translateY(1px); }
    .state.is-disabled .input-shell,
    .state.is-disabled .save { opacity: .5; cursor: not-allowed; }
    .state.is-loading .save { cursor: wait; }
    .state.is-error .input-shell { border-color: var(--danger); background: var(--danger-soft); }
    .state.is-error .meta { color: var(--danger); }
    .state.is-success .input-shell { border-color: var(--green); }
    .state.is-success .meta { color: var(--green); }
    @media (hover: hover) { .save:hover:not(:disabled) { background: var(--green-strong); } }
    @media (max-width: 760px) {
      main { width: min(100% - 24px, 560px); margin-top: 22px; }
      .states { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      .state { grid-template-columns: 1fr; gap: 8px; }
      .state > strong { padding-top: 0; }
      .mode button { min-width: 52px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <h1>整单优惠 · 双模式输入</h1>
    <p class="lede">开发预览，不进入生产构建。每个卡片固定展示一个交互状态。</p>
    <section class="states" aria-label="八种交互状态">
      <article class="state"><strong>default</strong><div class="control"><label>输入优惠</label><div class="input-shell"><div class="mode"><button class="is-selected">VND</button><button>%</button></div><input value="16,000" /></div><div class="meta"><span>减免 16,000 VND</span><span>应付 300,000 VND</span></div><button class="save">保存</button></div></article>
      <article class="state is-hover"><strong>hover</strong><div class="control"><label>输入优惠</label><div class="input-shell"><div class="mode"><button>VND</button><button class="is-selected">%</button></div><input value="20" /></div><div class="meta"><span>减免 63,200 VND</span><span>应付 252,800 VND</span></div><button class="save">保存</button></div></article>
      <article class="state is-focus"><strong>focus</strong><div class="control"><label>输入优惠</label><div class="input-shell"><div class="mode"><button class="is-selected">VND</button><button>%</button></div><input value="16,000" /></div><div class="meta"><span>键盘焦点清晰可见</span><span>精确金额</span></div><button class="save">保存</button></div></article>
      <article class="state is-active"><strong>active</strong><div class="control"><label>输入优惠</label><div class="input-shell"><div class="mode"><button>VND</button><button class="is-selected">%</button></div><input value="10" /></div><div class="meta"><span>减免 31,600 VND</span><span>应付 284,400 VND</span></div><button class="save">保存</button></div></article>
      <article class="state is-disabled"><strong>disabled</strong><div class="control"><label>输入优惠</label><div class="input-shell"><div class="mode"><button class="is-selected" disabled>VND</button><button disabled>%</button></div><input value="16,000" disabled /></div><div class="meta"><span>结算完成后不可修改</span><span></span></div><button class="save" disabled>保存</button></div></article>
      <article class="state is-loading"><strong>loading</strong><div class="control"><label>输入优惠</label><div class="input-shell"><div class="mode"><button class="is-selected" disabled>VND</button><button disabled>%</button></div><input value="16,000" disabled /></div><div class="meta"><span>正在保存精确金额…</span><span></span></div><button class="save" disabled>处理中…</button></div></article>
      <article class="state is-error"><strong>error</strong><div class="control"><label>输入优惠</label><div class="input-shell"><div class="mode"><button class="is-selected">VND</button><button>%</button></div><input value="400,000" aria-invalid="true" /></div><div class="meta"><span>减免金额不能超过商品金额</span><span>请重新输入</span></div><button class="save" disabled>保存</button></div></article>
      <article class="state is-success"><strong>success</strong><div class="control"><label>输入优惠</label><div class="input-shell"><div class="mode"><button class="is-selected">VND</button><button>%</button></div><input value="16,000" /></div><div class="meta"><span>已保存；正式组件静默关闭弹窗</span><span>应付 300,000 VND</span></div><button class="save">已保存</button></div></article>
    </section>
  </main>
</body>
</html>
