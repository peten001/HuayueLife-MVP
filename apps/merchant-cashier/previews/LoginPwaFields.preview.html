<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Login PWA fields — 8 states</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f6f1;
      --panel: #fbfcfa;
      --field: #f8faf7;
      --line: #d7dfd7;
      --text: #172a1f;
      --muted: #5f7066;
      --green: #24764a;
      --green-soft: #dfede3;
      --focus: rgb(36 118 74 / 24%);
      --danger: #ad443b;
      --danger-soft: #f8e7e4;
      --shadow: 0 18px 52px rgb(23 46 32 / 12%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--text); background: var(--page); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
    main { width: min(430px, calc(100% - 24px)); margin: 24px auto 48px; }
    h1 { margin: 0; font-size: 24px; }
    .lede { margin: 7px 0 20px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .states { display: grid; gap: 12px; }
    .state { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); }
    .state > strong { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .input-shell { display: grid; grid-template-columns: 20px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 50px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); outline: 3px solid transparent; outline-offset: 1px; }
    .input-shell span { color: var(--muted); font-size: 17px; text-align: center; }
    input { width: 100%; min-width: 0; min-height: 48px; padding: 0; border: 0; outline: 0; color: var(--text); background: transparent; font: inherit; font-size: 16px; }
    .state.is-hover .input-shell { border-color: var(--green); }
    .state.is-focus .input-shell { border-color: var(--green); outline-color: var(--focus); }
    .state.is-active .input-shell { background: var(--green-soft); }
    .state.is-disabled { opacity: .52; cursor: not-allowed; }
    .state.is-loading .input-shell { opacity: .68; cursor: wait; }
    .state.is-error .input-shell { border-color: var(--danger); background: var(--danger-soft); }
    .state.is-error > strong { color: var(--danger); }
    .state.is-success .input-shell { border-color: var(--green); }
    .state.is-success > strong { color: var(--green); }
    @media (hover: hover) { .input-shell:hover { border-color: var(--green); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <h1>登录输入框 · iPhone PWA</h1>
    <p class="lede">手机端字号固定为 16px，避免添加到主屏幕后聚焦输入框时被 iOS 自动放大。</p>
    <section class="states" aria-label="八种交互状态">
      <article class="state"><strong>default</strong><label>账号<span class="input-shell"><span>◎</span><input value="" placeholder="请输入账号" /></span></label></article>
      <article class="state is-hover"><strong>hover</strong><label>账号<span class="input-shell"><span>◎</span><input value="cashier01" /></span></label></article>
      <article class="state is-focus"><strong>focus-visible</strong><label>账号<span class="input-shell"><span>◎</span><input value="cashier01" autofocus /></span></label></article>
      <article class="state is-active"><strong>active</strong><label>密码<span class="input-shell"><span>◇</span><input type="password" value="password" /></span></label></article>
      <article class="state is-disabled"><strong>disabled</strong><label>账号<span class="input-shell"><span>◎</span><input value="cashier01" disabled /></span></label></article>
      <article class="state is-loading"><strong>loading</strong><label>账号<span class="input-shell"><span>◎</span><input value="正在登录…" disabled /></span></label></article>
      <article class="state is-error"><strong>error</strong><label>账号<span class="input-shell"><span>◎</span><input value="cashier01" aria-invalid="true" /></span></label></article>
      <article class="state is-success"><strong>success</strong><label>账号<span class="input-shell"><span>◎</span><input value="cashier01" /></span></label></article>
    </section>
  </main>
</body>
</html>
