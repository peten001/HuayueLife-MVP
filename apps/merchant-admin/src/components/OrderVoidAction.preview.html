<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrderVoidAction · 8 states · non-production preview</title>
<link rel="stylesheet" href="../styles/order-void.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; line-height: 1.5; background: var(--void-surface); }
  main { max-width: 680px; margin: auto; }
  h1 { font-size: 24px; }
  .state { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: start; padding: 16px 0; border-top: 1px solid var(--void-line); }
  .state p { margin: 8px 0 0; }
  @media (max-width: 390px) { body { padding: 16px; } .state { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
</style>
<body class="order-void-ui"><main>
<h1>删除（作废）· 八种状态</h1>
<p>仅用于本地视觉验收。以下按钮不会发送请求，不是生产页面。</p>
<section class="state" data-state="default"><span>默认</span><div><button class="void-button void-button--confirm" type="button">确认作废</button></div></section>
<section class="state" data-state="hover"><span>鼠标悬停</span><div><button class="void-button void-button--confirm is-hover" type="button">确认作废</button></div></section>
<section class="state" data-state="focus"><span>键盘焦点</span><div><button class="void-button void-button--confirm is-focus" type="button">确认作废</button></div></section>
<section class="state" data-state="active"><span>按下</span><div><button class="void-button void-button--confirm is-active" type="button">确认作废</button></div></section>
<section class="state" data-state="disabled"><span>尚未填写原因</span><div><button class="void-button void-button--confirm" type="button" disabled>确认作废</button><p>请选择原因；选择“其他”时填写说明。</p></div></section>
<section class="state" data-state="loading"><span>提交中</span><div><button class="void-button void-button--confirm" type="button" disabled aria-busy="true">正在作废…</button></div></section>
<section class="state" data-state="error"><span>预览已变化</span><div><p class="void-error" role="alert">预览后数据已变化。请重新核对金额，再确认作废。</p><button class="void-button" type="button">重新核对</button></div></section>
<section class="state" data-state="success"><span>成功后的只读态</span><div><p class="void-success" role="status">已作废，原记录和打印证据已保留。</p></div></section>
</main></body>
</html>
